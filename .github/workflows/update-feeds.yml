name: Update feeds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'feeds.json'
      - 'scripts/update_feeds.py'
      - 'scripts/update_extra.py'
      - 'scripts/update_cellar.py'
      - '.github/workflows/update-feeds.yml'
  schedule:
    - cron: '23 4,7 * * *'

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and convert feeds
        id: fetch
        continue-on-error: true
        run: python scripts/update_feeds.py
      - name: Fetch supplemental public sources
        id: extras
        continue-on-error: true
        run: python scripts/update_extra.py
      - name: Fetch EU case law from CELLAR
        id: cellar
        continue-on-error: true
        run: python scripts/update_cellar.py
      - name: Commit refreshed JSON snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public feed snapshots"
            git push
          fi
      - name: Mark feed errors as failed
        if: steps.fetch.outcome != 'success' || steps.extras.outcome != 'success' || steps.cellar.outcome != 'success'
        run: exit 1
