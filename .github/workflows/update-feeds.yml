name: Update feeds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'feeds.json'
      - 'scripts/update_feeds.py'
      - 'scripts/update_extra.py'
      - 'scripts/update_cellar.py'
      - 'scripts/update_bluesky.py'
      - 'scripts/update_vulnerabilities.py'
      - 'tests/**'
      - '.github/workflows/update-feeds.yml'
  schedule:
    # Distinct UTC triggers for 07:00 Europe/Berlin, depending on DST.
    # The offset gate tests the intended trigger rather than exact start minute.
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
    # BSI-only updates preserve fast-moving notices without re-fetching all sources.
    - cron: '10 0,3,9,12,15,18,21 * * *'

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Choose full, BSI-only or skipped run
        id: mode
        shell: bash
        run: |
          mode=skip
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            mode=daily
          elif [[ "${{ github.event.schedule }}" == "10 0,3,9,12,15,18,21 * * *" ]]; then
            mode=security
          else
            offset=$(TZ=Europe/Berlin date +%z)
            if [[ "${{ github.event.schedule }}" == "0 5 * * *" && "$offset" == "+0200" ]] ||
               [[ "${{ github.event.schedule }}" == "0 6 * * *" && "$offset" == "+0100" ]]; then
              mode=daily
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Selected refresh mode: $mode"
      - uses: actions/checkout@v5
        if: steps.mode.outputs.mode != 'skip'
        with:
          # Resolve main when the queued job starts, not when it was dispatched.
          ref: main
      - uses: actions/setup-python@v6
        if: steps.mode.outputs.mode != 'skip'
        with:
          python-version: '3.12'
      - name: Validate feed parser regressions
        if: steps.mode.outputs.mode != 'skip'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Fetch and convert feeds
        if: steps.mode.outputs.mode == 'daily'
        id: fetch
        continue-on-error: true
        run: python scripts/update_feeds.py
      - name: Refresh rolling BSI history only
        if: steps.mode.outputs.mode == 'security'
        id: bsi
        continue-on-error: true
        run: python scripts/update_feeds.py --security-only
      - name: Fetch supplemental public sources
        if: steps.mode.outputs.mode == 'daily'
        id: extras
        continue-on-error: true
        run: python scripts/update_extra.py
      - name: Fetch EU case law from CELLAR
        if: steps.mode.outputs.mode == 'daily'
        id: cellar
        continue-on-error: true
        run: python scripts/update_cellar.py
      - name: Fetch optional Bluesky signals
        if: steps.mode.outputs.mode == 'daily'
        continue-on-error: true
        run: python scripts/update_bluesky.py
      - name: Fetch optional vulnerability signals
        if: steps.mode.outputs.mode == 'daily'
        continue-on-error: true
        run: python scripts/update_vulnerabilities.py
      - name: Commit refreshed JSON snapshots
        if: steps.mode.outputs.mode != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public feed snapshots"
            # A different writer may advance main during this job. Retry only
            # after a clean rebase. Never force-push or overwrite conflicts.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              if [[ "$attempt" -eq 3 ]]; then
                echo "::error::Push failed after three attempts."
                exit 1
              fi
              echo "Remote main advanced. Fetching and rebasing (attempt $attempt)."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Data changed concurrently and rebase conflicted; refusing unsafe overwrite."
                exit 1
              fi
            done
          fi
      - name: Mark required-source errors as failed
        if: steps.mode.outputs.mode != 'skip' && (steps.fetch.outcome == 'failure' || steps.bsi.outcome == 'failure' || steps.extras.outcome == 'failure' || steps.cellar.outcome == 'failure')
        run: exit 1
