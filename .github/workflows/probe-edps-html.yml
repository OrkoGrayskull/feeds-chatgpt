name: Probe EDPS public web pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-edps-html.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check EDPS official HTML pages
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, html, sys
          from html.parser import HTMLParser
          urls = [
            "https://www.edps.europa.eu/press-publications/press-news/news_en",
            "https://www.edps.europa.eu/press-publications/press-news/press-releases_en",
            "https://www.edps.europa.eu/edps-homepage_en",
            "https://edps.europa.eu/press-publications/press-news/news_en",
            "https://edps.europa.eu/press-publications/press-news/press-releases_en",
          ]
          for url in urls:
            try:
              req = urllib.request.Request(url, headers={"Accept": "text/html,application/xhtml+xml", "User-Agent": "feeds-chatgpt/1.0 (public web source probe)"})
              with urllib.request.urlopen(req, timeout=18) as resp:
                raw = resp.read(2000001)
                status = resp.status
                target = resp.geturl()
                mime = resp.headers.get("Content-Type")
              page = raw.decode("utf-8", "replace")
              title = re.search(r"<title[^>]*>(.*?)</title>", page, re.I|re.S)
              title = re.sub(r"<[^>]+>", " ", html.unescape(title.group(1)))[:140] if title else "(none)"
              dates = re.findall(r"\b(?:[0-3]?\d\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+20\d{2}|20\d{2}[-/][01]\d[-/][0-3]\d)\b", page, re.I)
              links = re.findall(r'href=["\x27]([^"\x27]*(?:/press-releases/|/news/)[^"\x27]*)["\x27]', page, re.I)
              print(f"RESULT url={url} status={status} bytes={len(raw)} mime={mime} target={target} title={title!r} dates={dates[:4]} candidate_links={len(links)} first_links={links[:3]}")
            except Exception as e:
              print(f"ERROR url={url} type={type(e).__name__} detail={str(e)[:150]}")
          PY

      - name: Check EDPS official alternative channels
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          addresses = {
            "official-mastodon-rss": "https://social.edps.europa.eu/@EDPS.rss",
            "official-mastodon-profile": "https://social.edps.europa.eu/@EDPS",
            "bluesky-public-authorfeed": "https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=edps.europa.eu&limit=30",
            "bluesky-public-profile": "https://public.api.bsky.app/xrpc/app.bsky.actor.getProfile?actor=edps.europa.eu",
          }
          for label, url in addresses.items():
            try:
              req = urllib.request.Request(url, headers={"User-Agent":"feeds-chatgpt/1.0 (public source compatibility test)"})
              with urllib.request.urlopen(req, timeout=20) as response:
                data=response.read(800001)
                mime=response.headers.get("Content-Type","")
                status=response.status
              print(f"CHANNEL {label}: HTTP={status} MIME={mime} bytes={len(data)}")
              if "bsky" in url and "json" in mime:
                dataj=json.loads(data)
                if label == "bluesky-public-authorfeed":
                  posts=[p.get("post",{}).get("record",{}) for p in dataj.get("feed",[])]
                  print(f"  posts={len(posts)} first_date={posts[0].get('createdAt') if posts else None} first_text={(posts[0].get('text','')[:170]) if posts else None}")
                else:
                  print("  handle=",dataj.get("handle"), "displayName=",dataj.get("displayName"),"verified=",dataj.get("verification",{}))
              elif label=="official-mastodon-rss":
                print("  xml_prefix=",data[:180].decode("utf-8","replace").replace("\n"," "))
            except Exception as e:
              print(f"CHANNEL ERROR {label}: {type(e).__name__}: {str(e)[:180]}")
          PY

      - name: Inspect official Mastodon RSS entry structure
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          url="https://social.edps.europa.eu/@EDPS.rss"
          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"feeds-chatgpt/1.0"}),timeout=20) as r:
            root=ET.fromstring(r.read(200000))
          print("RSSROOT",root.tag,"CHILDREN",[(x.tag,len(x)) for x in root][:8])
          items=root.findall("./channel/item")
          print("RSS ITEMS",len(items))
          for item in items[:3]:
            print("ENTRY FIELDS",[(x.tag,(x.text or "")[:200],x.attrib) for x in list(item)[:12]])
          PY
