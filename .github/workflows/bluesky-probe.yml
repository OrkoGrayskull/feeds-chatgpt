name: Bluesky API connectivity probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bluesky-probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check public Bluesky search endpoints
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error, datetime, time
          output = {"checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"checks":[]}
          for host in ("https://public.api.bsky.app","https://api.bsky.app"):
            for q in ("CVE","Datenschutz"):
              url=host+"/xrpc/app.bsky.feed.searchPosts?"+urllib.parse.urlencode({"q":q,"limit":5,"sort":"latest"})
              item={"host":host,"query":q}
              try:
                req=urllib.request.Request(url,headers={"User-Agent":"feeds-chatgpt-connectivity-probe/1.0","Accept":"application/json"})
                with urllib.request.urlopen(req,timeout=12) as response:
                  data=json.load(response)
                  posts=data.get("posts",[])
                  item.update(http_status=response.status,post_count=len(posts),has_timestamps=all(bool(p.get("record",{}).get("createdAt")) for p in posts),has_uris=all(bool(p.get("uri")) for p in posts))
              except urllib.error.HTTPError as e: item.update(http_status=e.code,error="HTTP error")
              except Exception as e: item.update(error=type(e).__name__)
              output["checks"].append(item)
          with open("bluesky-probe-result.json","w") as f:json.dump(output,f,indent=2)
          print(json.dumps(output,indent=2))
          PY
      - name: Save probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bluesky-probe-result.json
          git commit -m "Record temporary Bluesky API connectivity probe" && git push || true
