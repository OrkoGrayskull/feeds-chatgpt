name: Probe public RSS candidates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-public-rss.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate candidate RSS feeds without publishing
        shell: bash
        run: |
          python3 - <<'PY'
          import email.utils
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          import datetime
          import sys
          
          sources = {
              "noyb": "https://noyb.eu/en/rss",
              "eu-digital-strategy": "https://digital-strategy.ec.europa.eu/en/rss.xml",
          }
          problems = []
          for name, url in sources.items():
              try:
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "feeds-chatgpt/1.0 (RSS compatibility check)",
                      "Accept": "application/rss+xml, application/atom+xml, application/xml, text/xml, */*",
                  })
                  with urllib.request.urlopen(req, timeout=22) as response:
                      blob = response.read(3000001)
                      print(f"{name}: HTTP={response.status} MIME={response.headers.get('Content-Type')} bytes={len(blob)} resolved={response.geturl()}")
                      if len(blob) > 3000000:
                          raise ValueError("RSS too large")
                  root = ET.fromstring(blob)
                  atom = '{http://www.w3.org/2005/Atom}'
                  if root.tag == 'rss':
                      entries = root.findall('./channel/item')
                      def read(i):
                          return (i.findtext('title'), i.findtext('link'), i.findtext('pubDate'))
                  elif root.tag == atom+'feed':
                      entries = root.findall(atom+'entry')
                      def read(i):
                          a = next((a for a in i.findall(atom+'link') if a.attrib.get('href') and a.attrib.get('rel','alternate') == 'alternate'), None)
                          return (i.findtext(atom+'title'), a.attrib.get('href') if a is not None else None, i.findtext(atom+'updated') or i.findtext(atom+'published'))
                  else:
                      raise ValueError(f"Unknown XML root: {root.tag}")
                  valid=[]
                  for entry in entries:
                      title,link,date=read(entry)
                      if not title or not link or not date or urllib.parse.urlparse(link).scheme not in ('https','http'):
                          continue
                      try:
                          dt=email.utils.parsedate_to_datetime(date)
                      except Exception:
                          dt=datetime.datetime.fromisoformat(date.replace('Z','+00:00'))
                      valid.append((title,link,date,dt))
                  if len(valid)<2:
                      raise ValueError(f"Not enough dated entries: {len(valid)} from {len(entries)}")
                  print(f"{name}: PASS entries={len(entries)} dated={len(valid)} newest_date={max(a[3] for a in valid).isoformat()} first_title={valid[0][0][:120]}")
              except Exception as exc:
                  problems.append(name)
                  print(f"{name}: FAIL {type(exc).__name__}: {exc}", file=sys.stderr)
          if problems:
              print("FAILED: "+", ".join(problems), file=sys.stderr)
              sys.exit(1)
          print("BOTH SOURCES PASSED")
          PY
