name: Probe CELLAR case law
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_cellar.py'
      - '.github/workflows/probe-cellar.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query CELLAR SPARQL
        run: python scripts/probe_cellar.py
      - name: Commit diagnostic snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cellar-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Record CELLAR SPARQL probe"
            git push
          fi
