name: Probe InfoCuria

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_infocuria.py'
      - '.github/workflows/probe-infocuria.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test InfoCuria HTML accessibility
        id: probe
        continue-on-error: true
        run: python scripts/probe_infocuria.py
      - name: Save diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/infocuria-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Record InfoCuria probe results"
            git push
          fi
      - name: Report probe failure
        if: steps.probe.outcome != 'success'
        run: exit 1
